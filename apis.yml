aid: path-ai
name: PathAI
description: >-
  PathAI is a Boston-based digital pathology company that builds AI-powered
  technology to improve the accuracy and efficiency of cancer and disease
  diagnosis. Its flagship AISight Image Management System is a cloud-native,
  open enterprise platform that laboratories and research centers use to power
  digital pathology workflows and run AI applications against whole-slide
  images. PathAI also develops proprietary machine-learning algorithms for
  biomarker analysis and biopharma research, backed by a network of 450+
  pathologists who have contributed tens of millions of image annotations. For
  developers, PathAI publishes AISight Link, an open API framework that lets
  third-party algorithm developers integrate their solutions into the AISight
  workflow (AI Impressions, Fields of Interest, quantitative result reporting,
  and case-level tools). AISight Link is a partner-integration API without a
  public self-serve developer portal; access is arranged through PathAI
  (digitaldx@pathai.com).
